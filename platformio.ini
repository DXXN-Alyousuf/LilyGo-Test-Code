; PlatformIO project for the LilyGo T5 4.7" ePaper (ESP32-S3, non-touch variant)
; See README.md for wiring notes and what this test exercises.

[platformio]
boards_dir = boards
default_envs = T5-ePaper-S3

[env:T5-ePaper-S3]
platform = espressif32@6.12.0
board = T5-ePaper-S3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0

lib_deps =
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
	lewisxhe/SensorLib @ ^0.3.1
	lennarthennigs/Button2 @ ^2.3.2
	Wire
	SPI
	SD
